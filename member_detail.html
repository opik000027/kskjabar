<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Anggota KEI SHIN KAN</title>
    <!-- Link ke Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Konfigurasi Tailwind untuk menambahkan warna dan font kustom jika diperlukan -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'], // Font Inter
                    },
                    colors: {
                        primary: '#B40000', // Contoh warna merah khas klub
                        secondary: '#333333', // Contoh warna gelap untuk teks
                        accent: '#F9A826', // Contoh warna aksen
                    }
                }
            }
        }
    </script>
    <!-- Link ke Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Favicon (Logo di tab browser) -->
    <link rel="icon" href="img/logo-ksk.png" type="image/png">
    <!-- qrious.js CDN for QR Code (pengganti qrcode.js yang bermasalah dengan CSP) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        .member-detail-container {
            max-width: 800px;
            margin: 2rem auto;
            background-color: white;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .detail-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .detail-item i {
            color: #B40000;
            margin-right: 0.75rem;
            width: 1.5rem; /* Consistent icon width */
            text-align: center;
        }
        .qrcode-container {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }
        /* Mengubah styling dari div ke canvas untuk QRious */
        .qrcode-container canvas {
            margin: 0 auto;
            display: block;
            max-width: 90%;
            width: 150px; /* Set QR code container dimensions */
            height: 150px;
        }

        /* Styling for the printable ID card section */
        #printable-id-card-area {
            display: none; /* Hidden by default, only for print */
            /* Removed border, box-shadow, background-color, padding, overflow: hidden here as it will be managed by @media print */
            text-align: center;
            font-family: 'Inter', sans-serif;
            color: #333333;
        }
        /* These styles will only apply when actually printing */
        #printable-id-card-area .id-card-content-wrapper {
            /* This div will be the actual ID card size */
            width: 3.375in; /* Standard ID card width (CR80) */
            height: 2.125in; /* Standard ID card height (CR80) */
            padding: 0.15in; /* Adjusted padding for print, moved from #printable-id-card-area */
            box-sizing: border-box; /* Include padding in width/height */
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Space out content and footer */
            background-color: white; /* Ensure white background for print */
            border: 1px solid #ccc; /* Add a light border for printing */
            border-radius: 0.25rem; /* Slight rounding for printed card */
        }

        #printable-id-card-area .id-card-header {
            background-color: #ffffff;
            border-radius: 0.25rem 0.25rem 0 0; /* Only top rounded in print */
            box-shadow: none; /* No shadow in print */
            margin: -0.15in -0.15in 0.15in -0.15in; /* Adjust margin to fill the top, accounting for padding */
            padding: 0.1in;
            width: calc(100% + 0.3in); /* Fill width, accounting for negative margin */
            border-bottom: 1px solid #B40000; /* Re-add border if desired */
            height: auto;
        }
        #printable-id-card-area .id-card-header img {
            height: 30px; /* Smaller logo for print */
            width: 30px;
            border: 1px solid #F9A826;
            margin-right: 0.15rem;
        }
        #printable-id-card-area .id-card-header h4 {
            font-size: 0.9rem; /* Smaller title for print */
            margin-bottom: 0;
        }

        #printable-id-card-area img.member-photo {
            width: 50px; /* Smaller photo for print */
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 0.2rem auto;
            border: 2px solid #F9A826;
            box-shadow: none; /* No shadow in print */
        }
        #printable-id-card-area p, #printable-id-card-area strong {
            font-size: 0.6rem; /* Smaller font for details */
            line-height: 1.1;
            margin-bottom: 0.05rem;
        }
        #printable-id-card-area .barcode-area {
            display: flex;
            justify-content: center;
            margin-top: 0.3rem;
            margin-bottom: 0.1rem;
        }
        #printable-id-card-qrcode {
            width: 60px; /* Smaller QR code for print */
            height: 60px;
            padding: 1px; /* Smaller padding around QR */
            background-color: white;
        }
        #printable-id-card-area .text-xs { /* Specific override for "Scan untuk Kehadiran" */
            font-size: 0.5rem;
        }
        
        /* New styling for the ID card footer */
        #printable-id-card-area .id-card-footer {
            background-color: #333333; /* Dark background */
            color: white;
            font-size: 0.5rem;
            padding: 0.15rem; /* Small padding */
            border-radius: 0 0 0.25rem 0.25rem; /* Bottom rounded corners */
            margin: 0.15in -0.15in -0.15in -0.15in; /* Adjust to fill bottom and compensate padding */
            width: calc(100% + 0.3in); /* Match header width */
            text-align: center;
        }
        #printable-id-card-area .id-card-footer i {
            margin-right: 2px;
        }


        @media print {
            @page {
                size: 3.375in 2.125in; /* Set page size to CR80 ID card dimensions */
                margin: 0; /* Remove default margins */
            }

            body {
                margin: 0; /* Ensure body has no margin for printing */
                display: block; /* Ensure body is visible for printing */
            }

            /* Hide everything not part of the ID card for printing */
            body > *:not(#printable-id-card-area) {
                display: none !important;
            }

            #printable-id-card-area {
                display: block !important; /* Make sure only this section is visible */
                position: absolute; /* Use absolute to position within the page */
                top: 0;
                left: 0;
                width: 100%; /* Take full width of the print page */
                height: 100%; /* Take full height of the print page */
                margin: 0;
                padding: 0; /* Remove padding as it's now in id-card-content-wrapper */
                box-shadow: none;
                border: none;
                overflow: hidden; /* Prevent scrollbars */
                background-color: white;
            }
            
            #printable-id-card-area .id-card-content-wrapper {
                width: 3.375in; /* Standard ID card width (CR80) */
                height: 2.125in; /* Standard ID card height (CR80) */
                margin: 0; /* No margin here, use page margin or flex positioning */
                position: absolute; /* Position it precisely on the page */
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%); /* Center the ID card on the print page */
                box-shadow: none;
                border: 1px solid #ccc; /* Add a light border for printing */
            }

            .no-print {
                display: none !important; /* Hide navigation and footer in print */
            }
        }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        // Mengimpor fungsi Firebase dari CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

        // Konfigurasi Firebase Anda.
        const firebaseConfig = {
             apiKey: "AIzaSyCAjAjkoQhx1eB7IxhpA5Yi8Z7wZC7nhzM",
             authDomain: "kskjabar-f01f1.firebaseapp.com",
             projectId: "kskjabar-f01f1",
             storageBucket: "kskjabar-f01f1.firebasestorage.app",
             messagingSenderId: "383836530077",
             appId: "1:383836530077:web:6ab44455755626d5fa3b74",
             measurementId: "G-N251SVP9VN" 
        };
        
        let app;
        let auth; // Instansi Auth
        let db;
        let firebaseInitialized = false;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const membersCollectionPath = `artifacts/${appId}/public/data/members`;

        async function initializeFirebaseAndAuth() {
            if (firebaseConfig) { 
                try {
                    app = initializeApp(firebaseConfig);
                    auth = getAuth(app); // Get Auth instance
                    db = getFirestore(app);
                    firebaseInitialized = true;
                    console.log("Firebase initialized for member_detail.html.");

                    // Sign in anonymously if no user is authenticated
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            console.log("User already signed in:", user.uid);
                            loadMemberDetails(); // Muat detail anggota setelah Firebase terinisialisasi dan pengguna login
                        } else {
                            try {
                                await signInAnonymously(auth);
                                console.log("Signed in anonymously.");
                                loadMemberDetails(); // Muat detail anggota setelah sign-in anonim berhasil
                            } catch (error) {
                                console.error("Anonymous sign-in failed:", error.message);
                                // Pesan ini kemungkinan besar berarti Anda perlu mengaktifkan "Anonymous" sign-in provider di konsol Firebase Anda.
                                // Buka Firebase Console -> Authentication -> tab "Sign-in method" -> Aktifkan "Anonymous".
                                document.getElementById('member-details-card').innerHTML = `<p class="text-center text-red-500">Gagal login untuk memuat detail: ${error.message}<br>Harap pastikan "Anonymous" Sign-in Provider diaktifkan di Firebase Authentication Anda.</p>`;
                                // Redirect jika otentikasi gagal, misalnya ke index.html atau halaman error khusus
                                // window.location.href = window.location.origin + '/index.html'; 
                            }
                        }
                    });

                } catch (error) {
                    console.error("Firebase initialization error for member_detail.html:", error.message);
                    document.getElementById('member-details-card').innerHTML = `<p class="text-center text-red-500">Gagal menginisialisasi Firebase: ${error.message}</p>`;
                }
            } else {
                console.error("Firebase config is not available. Cannot initialize Firebase for member_detail.html.");
                document.getElementById('member-details-card').innerHTML = '<p class="text-center text-red-500">Konfigurasi Firebase tidak ditemukan. Mohon perbarui kode.</p>';
            }
        }

        async function loadMemberDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('id');
            const detailsCard = document.getElementById('member-details-card');

            console.log("URL Params:", window.location.search); // Debugging: Log the full URL parameters
            console.log("Retrieved Member ID:", memberId);     // Debugging: Log the retrieved ID

            if (!memberId) {
                detailsCard.innerHTML = '<p class="text-center text-red-500">ID Anggota tidak ditemukan di URL. Pastikan Anda membuka halaman ini dari tombol "Detail" di dashboard.</p>';
                return;
            }

            if (!firebaseInitialized || !db) {
                detailsCard.innerHTML = '<p class="text-center text-red-500">Firebase belum terinisialisasi.</p>';
                return;
            }

            try {
                const memberDocRef = doc(db, membersCollectionPath, memberId);
                const docSnap = await getDoc(memberDocRef);

                if (docSnap.exists()) {
                    const member = docSnap.data();
                    
                    // Update main detail card
                    detailsCard.innerHTML = `
                        <div class="text-center mb-6">
                            <img src="${member.photoUrl || 'https://placehold.co/150x150/CCCCCC/000000?text=Foto'}" alt="Foto Anggota" class="w-36 h-36 rounded-full object-cover mx-auto mb-4 border-4 border-primary shadow-lg">
                            <h2 class="text-3xl font-bold text-primary mb-2">${member.name || 'Nama Tidak Tersedia'}</h2>
                            <p class="text-lg text-gray-700"><strong>Nomor Anggota:</strong> ${memberId}</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-lg text-gray-700">
                            <div class="detail-item"><i class="fas fa-calendar-alt"></i><strong>Tanggal Lahir:</strong> ${member.dateOfBirth || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-map-marker-alt"></i><strong>Tempat Lahir:</strong> ${member.placeOfBirth || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-tshirt"></i><strong>Tingkat Sabuk:</strong> ${member.beltLevel || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-building"></i><strong>Dojo:</strong> ${member.dojoName || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-city"></i><strong>Cabang:</strong> ${member.city || 'N/A'}</div>
                            <div class="detail-item col-span-full">
                                <i class="fas fa-link"></i>
                                <div>
                                    <strong>Dokumen:</strong><br>
                                    <a href="${member.birthCertUrl}" target="_blank" class="text-blue-500 hover:underline">Akta Kelahiran</a><br>
                                    <a href="${member.beltCertUrl}" target="_blank" class="text-blue-500 hover:underline">Ijazah Sabuk</a>
                                </div>
                            </div>
                        </div>
                        <div class="qrcode-container">
                            <h3 class="text-xl font-bold text-secondary mb-2">QR Code Kehadiran</h3>
                            <canvas id="member-detail-qrcode"></canvas>
                            <p class="text-sm text-gray-600 mt-2">ID Anggota: ${memberId}</p>
                        </div>
                    `;

                    // Generate QR Code for main detail page
                    const qrcodeCanvas = document.getElementById('member-detail-qrcode');
                    if (qrcodeCanvas && typeof window.QRious !== 'undefined') {
                        new window.QRious({
                            element: qrcodeCanvas,
                            value: String(memberId),
                            size: 150,
                            foreground: '#000000',
                            background: '#ffffff',
                            level: 'H'
                        });
                        console.log("QR Code berhasil dibuat di member_detail.html (main detail).");
                    } else {
                        console.error("Error: Library QRious tidak dimuat atau elemen QR Code tidak ditemukan untuk detail utama.");
                        detailsCard.querySelector('.qrcode-container').innerHTML += `<p class="text-red-500">Gagal membuat QR Code: Library tidak dimuat atau elemen tidak ditemukan.</p>`;
                    }

                    // Populate the hidden printable ID card area
                    document.getElementById('printable-id-card-photo').src = member.photoUrl || 'https://placehold.co/100x100/CCCCCC/000000?text=Foto';
                    document.getElementById('printable-id-card-name').textContent = member.name;
                    document.getElementById('printable-id-card-dob').textContent = `TTL: ${member.placeOfBirth || 'N/A'}, ${member.dateOfBirth || 'N/A'}`;
                    document.getElementById('printable-id-card-belt').textContent = `Sabuk: ${member.beltLevel || 'N/A'}`;
                    document.getElementById('printable-id-card-dojo').textContent = `Dojo: ${member.dojoName || 'N/A'}`;
                    document.getElementById('printable-id-card-city').textContent = `Cabang: ${member.city || 'N/A'}`;
                    
                    // Generate QR Code for the printable ID card
                    const printableQrcodeCanvas = document.getElementById('printable-id-card-qrcode');
                    if (printableQrcodeCanvas && typeof window.QRious !== 'undefined') {
                        new window.QRious({
                            element: printableQrcodeCanvas,
                            value: String(memberId),
                            size: 128, // Ukuran QR untuk ID Card cetak
                            foreground: '#000000',
                            background: '#ffffff',
                            level: 'H'
                        });
                        console.log("QR Code berhasil dibuat di member_detail.html (printable ID Card).");
                    } else {
                        console.error("Error: Library QRious tidak dimuat atau elemen QR Code tidak ditemukan untuk ID Card cetak.");
                    }

                } else {
                    detailsCard.innerHTML = '<p class="text-center text-red-500">Detail anggota tidak ditemukan.</p>';
                }
            } catch (error) {
                console.error("Error loading member details:", error);
                detailsCard.innerHTML = `<p class="text-center text-red-500">Gagal memuat detail anggota: ${error.message}</p>`;
            }
        }

        // Fungsi baru untuk mencetak ID Card dari halaman member_detail
        function printMemberIdCard() {
            const mainContent = document.querySelector('main');
            const navBar = document.querySelector('nav');
            const footer = document.querySelector('footer');
            const printableArea = document.getElementById('printable-id-card-area');

            // Sembunyikan elemen utama dan tampilkan hanya area cetak ID card
            mainContent.style.display = 'none';
            navBar.style.display = 'none';
            footer.style.display = 'none';
            printableArea.style.display = 'flex'; // Use flex to center the content within the print area

            window.print();

            // Kembalikan visibilitas dan display setelah dialog cetak ditutup
            setTimeout(() => {
                mainContent.style.display = ''; // Kembalikan ke default display
                navBar.style.display = '';
                footer.style.display = '';
                printableArea.style.display = 'none'; // Sembunyikan area ID card lagi
            }, 500); // Penundaan kecil untuk memastikan browser selesai dengan dialog cetak
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeFirebaseAndAuth(); // Memastikan inisialisasi Firebase berjalan

            // Menghubungkan tombol "Cetak ID Card"
            const printMemberIdCardBtn = document.getElementById('print-member-id-card-btn');
            if (printMemberIdCardBtn) {
                printMemberIdCardBtn.addEventListener('click', printMemberIdCard);
            }
        });
    </script>
</head>
<body class="bg-gray-100 text-secondary font-inter min-h-screen flex flex-col">

    <!-- Navigasi Bar -->
    <nav class="w-full bg-white shadow-lg py-4 z-50 rounded-b-lg no-print">
        <div class="container mx-auto flex justify-between items-center px-4">
            <!-- Logo Klub -->
            <a href="index.html" class="flex items-center space-x-2">
                <img src="img/logo-ksk.png" alt="Logo KEI SHIN KAN" class="h-12 w-12 rounded-full shadow-md">
                <span class="text-xl font-bold text-primary">KEI SHIN KAN</span>
            </a>
            <!-- Back to Dashboard Link and Print ID Card Button -->
            <div class="flex items-center space-x-4">
                <a href="dashboard.html" class="bg-gray-200 text-secondary px-5 py-2 rounded-full font-bold hover:bg-gray-300 transition duration-300 shadow-md">
                    <i class="fas fa-arrow-left mr-2"></i>Kembali ke Dashboard
                </a>
                <button id="print-member-id-card-btn" class="bg-blue-500 text-white px-5 py-2 rounded-full font-bold hover:bg-blue-600 transition duration-300 shadow-md">
                    <i class="fas fa-id-card mr-2"></i>Cetak ID Card
                </button>
            </div>
        </div>
    </nav>

    <!-- Konten Halaman Detail Anggota -->
    <main class="flex-grow flex items-center justify-center p-4">
        <section id="member-details-card" class="member-detail-container print-area">
            <p class="text-center text-gray-500">Memuat detail anggota...</p>
        </section>
    </main>

    <!-- New section for the printable ID card (hidden by default) -->
    <div id="printable-id-card-area" class="fixed top-0 left-0 w-screen h-screen flex items-center justify-center z-50">
        <div class="id-card-content-wrapper">
            <div class="id-card-header flex items-center justify-center p-4 border-b-2 border-primary">
                <img src="img/logo-ksk.png" alt="Logo KEI SHIN KAN" class="h-12 w-12 rounded-full object-cover mr-4">
                <h4 class="text-3xl font-bold text-primary">KEI SHIN KAN</h4>
            </div>
            <img id="printable-id-card-photo" src="" alt="Foto Anggota" class="member-photo mx-auto mt-4">
            <p class="font-bold text-xl text-center mb-2" id="printable-id-card-name"></p>
            <div class="text-sm text-gray-700 text-center space-y-1 px-4">
                <p id="printable-id-card-dob"></p>
                <p id="printable-id-card-belt"></p>
                <p id="printable-id-card-dojo"></p>
                <p id="printable-id-card-city"></p>
            </div>
            <div class="barcode-area flex justify-center mt-4">
                <canvas id="printable-id-card-qrcode" class="p-2 bg-white rounded-lg shadow-inner"></canvas>
            </div>
            <p class="text-xs text-gray-600 text-center mt-2">Scan untuk Kehadiran</p>
            <!-- New ID card footer -->
            <div class="id-card-footer">
                <p>&copy; 2025 KEI SHIN KAN Jawa Barat</p>
                <p><i class="fas fa-phone-alt"></i> (022) 1234-5678</p>
            </div>
        </div>
    </div>

    <!-- Footer Utama (Tidak dicetak) -->
    <footer class="bg-gray-900 text-white py-8 rounded-t-lg mt-auto no-print">
        <div class="container mx-auto text-center px-4">
            <p class="mb-2">&copy; 2025 KEI SHIN KAN Jawa Barat. Hak Cipta Dilindungi.</p>
            <p class="mb-2"><i class="fas fa-map-marker-alt mr-2"></i>Sekretariat: Jl. Contoh Alamat No. 123, Bandung, Jawa Barat</p>
            <p><i class="fas fa-phone-alt mr-2"></i>Telepon: (022) 1234-5678</p>
        </div>
    </footer>

</body>
</html>
