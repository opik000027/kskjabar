<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Anggota KEI SHIN KAN</title>
    <!-- Link ke Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Konfigurasi Tailwind untuk menambahkan warna dan font kustom jika diperlukan -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'], // Font Inter
                    },
                    colors: {
                        primary: '#B40000', // Contoh warna merah khas klub
                        secondary: '#333333', // Contoh warna gelap untuk teks
                        accent: '#F9A826', // Contoh warna aksen
                    }
                }
            }
        }
    </script>
    <!-- Link ke Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Favicon (Logo di tab browser) -->
    <link rel="icon" href="img/logo-ksk.png" type="image/png">
    <!-- qrious.js CDN for QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- html2canvas CDN for converting HTML to canvas/image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        .member-detail-container {
            max-width: 800px;
            margin: 2rem auto;
            background-color: white;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .detail-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .detail-item i {
            color: #B40000;
            margin-right: 0.75rem;
            width: 1.5rem; /* Consistent icon width */
            text-align: center;
        }
        .qrcode-container {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }
        /* Mengubah styling dari div ke canvas untuk QRious */
        .qrcode-container canvas {
            margin: 0 auto;
            display: block;
            max-width: 90%;
            width: 150px; /* Set QR code container dimensions */
            height: 150px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90%; /* Max width for general modals */
            transform: translateY(-20px);
            transition: transform 0.3s ease-in-out;
            overflow-y: auto;
            max-height: 90vh;
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        /* ID Card Preview Modal specific styles */
        #id-card-preview-modal-overlay .modal-content {
            padding: 0; /* No padding on modal content, as .id-card-content-wrapper will handle it */
            max-width: 3.375in; /* Match ID card width */
            max-height: 2.125in; /* Match ID card height */
            width: 3.375in; /* Force width */
            height: 2.125in; /* Force height */
            border: none; /* Remove modal border */
            border-radius: 0.15rem; /* Match ID card border-radius */
            overflow: hidden; /* Important for clean edges */
        }
        /* Make id-card-content-wrapper fill the modal */
        #id-card-preview-modal-overlay .id-card-content-wrapper {
            width: 100%;
            height: 100%;
            margin: 0;
            border: none; /* Modal will have its own border, or remove it entirely */
            box-shadow: none;
            border-radius: 0; /* Reset for modal container */
        }

        /* Styling for the ID card content inside the wrapper */
        .id-card-content-wrapper {
            padding: 0.15in; /* Standard ID card padding */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: white;
            border: 1px solid #000; /* Main border for the card */
            border-radius: 0.15rem;
            position: relative;
            overflow: hidden;
            height: 100%; /* Ensure it takes full height of parent */
        }

        .id-card-header {
            background-color: #ffffff;
            border-radius: 0.15rem 0.15rem 0 0;
            box-shadow: none;
            margin: -0.15in -0.15in 0.05in -0.15in; /* Adjust margin to fill the top */
            padding: 0.1in;
            width: calc(100% + 0.3in);
            border-bottom: 1px solid #B40000;
            height: auto;
            flex-shrink: 0;
        }
        .id-card-header img {
            height: 30px;
            width: 30px;
            border: 1px solid #F9A826;
            margin-right: 0.1rem;
        }
        .id-card-header h4 {
            font-size: 0.9rem;
            margin-bottom: 0;
            line-height: 1.2;
        }

        .id-card-content { /* New class for the main content area */
            flex-grow: 1; /* Allow content to grow and push footer down */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
        }

        .id-card-content img.member-photo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0.05in auto 0.05in auto;
            border: 2px solid #F9A826;
            box-shadow: none;
            flex-shrink: 0;
        }
        .id-card-content p, .id-card-content strong {
            font-size: 0.08in; /* Adjusted to be slightly smaller for more fit */
            line-height: 1.05;
            margin-bottom: 0.01in;
            word-break: break-word;
        }
        .id-card-content .barcode-area {
            display: flex;
            justify-content: center;
            margin-top: 0.04in;
            margin-bottom: 0.04in;
            flex-shrink: 0; /* Prevent QR code from shrinking too much */
        }
        #id-card-preview-qrcode { /* Renamed for clarity in preview modal */
            width: 0.55in;
            height: 0.55in;
            padding: 1px;
            background-color: white;
            flex-shrink: 0;
        }
        .id-card-content .text-xs {
            font-size: 0.06in;
        }
        
        .id-card-footer {
            background-color: #333333;
            color: white;
            font-size: 0.07in;
            padding: 0.08in 0.15in;
            border-radius: 0 0 0.15rem 0.15rem;
            margin: 0.05in -0.15in -0.15in -0.15in;
            width: calc(100% + 0.3in);
            text-align: center;
            flex-shrink: 0;
            line-height: 1.1;
        }
        .id-card-footer p {
            font-size: 0.07in;
            margin: 0;
        }
        .id-card-footer i {
            margin-right: 2px;
        }


        @media print {
            /* Hide everything that is NOT the ID card preview modal when printing */
            body > *:not(#id-card-preview-modal-overlay) {
                display: none !important;
            }

            /* Make the modal overlay visible and cover the whole page for printing */
            #id-card-preview-modal-overlay {
                display: flex !important; /* Use flex to center the card */
                position: absolute !important; /* Absolute positioning for print */
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important; /* Full viewport width */
                height: 100vh !important; /* Full viewport height */
                background-color: white !important; /* Ensure white background for print */
                margin: 0 !important;
                padding: 0 !important;
                justify-content: center !important;
                align-items: center !important;
                opacity: 1 !important;
                visibility: visible !important;
                z-index: 9999 !important; /* Ensure it's on top */
            }

            /* The actual ID card wrapper should be exactly CR80 size */
            #id-card-preview-modal-overlay .id-card-content-wrapper {
                width: 3.375in !important; /* Standard ID card width (CR80) */
                height: 2.125in !important; /* Standard ID card height (CR80) */
                border: 1px solid #000 !important; /* A professional border */
                border-radius: 0.15rem !important; /* Match border-radius */
                box-shadow: none !important; /* No shadow on print */
                margin: 0 !important; /* Ensure no external margins */
                overflow: hidden !important; /* Prevent content overflow */
                /* All padding and internal layout is handled by the wrapper's own rules */
            }

            /* Hide modal control buttons when printing */
            #id-card-preview-modal-overlay .modal-actions {
                display: none !important;
            }

            /* Ensure header/footer margins match the wrapper's padding for edge-to-edge look */
            #id-card-preview-modal-overlay .id-card-header,
            #id-card-preview-modal-overlay .id-card-footer {
                margin-left: -0.15in !important;
                margin-right: -0.15in !important;
                width: calc(100% + 0.3in) !important;
                border-radius: 0 !important; /* Remove rounding for full edge-to-edge in print */
            }
            #id-card-preview-modal-overlay .id-card-header {
                border-top-left-radius: 0.15rem !important;
                border-top-right-radius: 0.15rem !important;
                margin-top: -0.15in !important;
                padding-top: 0.1in !important;
                padding-bottom: 0.1in !important;
            }
            #id-card-preview-modal-overlay .id-card-footer {
                border-bottom-left-radius: 0.15rem !important;
                border-bottom-right-radius: 0.15rem !important;
                margin-bottom: -0.15in !important;
                padding-top: 0.08in !important;
                padding-bottom: 0.08in !important;
            }

            /* Adjust internal element margins/sizes to fit better in the tight space */
            #id-card-preview-modal-overlay img.member-photo {
                margin-top: 0.05in !important;
                margin-bottom: 0.05in !important;
            }
            #id-card-preview-modal-overlay p, #id-card-preview-modal-overlay strong {
                font-size: 0.08in !important; /* Slightly smaller font for more content */
                line-height: 1.05 !important;
                margin-bottom: 0.01in !important;
            }
            #id-card-preview-modal-overlay .barcode-area {
                margin-top: 0.04in !important;
                margin-bottom: 0.04in !important;
            }
            #id-card-preview-qrcode {
                width: 0.55in !important; /* Slightly smaller QR code */
                height: 0.55in !important;
            }
            #id-card-preview-modal-overlay .text-xs {
                font-size: 0.06in !important;
            }

            @page {
                size: 3.375in 2.125in; /* Set page size to CR80 ID card dimensions */
                margin: 0 !important; /* Remove all default margins */
                padding: 0 !important; /* Remove all default paddings */
            }
            html, body {
                width: 100vw;
                height: 100vh;
                margin: 0 !important;
                padding: 0 !important;
                display: block;
                overflow: hidden;
                background-color: white; /* Ensure white background for the entire page */
            }
        }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        // Mengimpor fungsi Firebase dari CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

        // Konfigurasi Firebase Anda.
        const firebaseConfig = {
             apiKey: "AIzaSyCAjAjkoQhx1eB7IxhpA5Yi8Z7wZC7nhzM",
             authDomain: "kskjabar-f01f1.firebaseapp.com",
             projectId: "kskjabar-f01f1",
             storageBucket: "kskjabar-f01f1.firebasestorage.app",
             messagingSenderId: "383836530077",
             appId: "1:383836530077:web:6ab44455755626d5fa3b74",
             measurementId: "G-N251SVP9VN" 
        };
        
        let app;
        let auth; // Instansi Auth
        let db;
        let firebaseInitialized = false;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const membersCollectionPath = `artifacts/${appId}/public/data/members`;

        async function initializeFirebaseAndAuth() {
            if (firebaseConfig) { 
                try {
                    app = initializeApp(firebaseConfig);
                    auth = getAuth(app); // Get Auth instance
                    db = getFirestore(app);
                    firebaseInitialized = true;
                    console.log("Firebase initialized for member_detail.html.");

                    // Sign in anonymously if no user is authenticated
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            console.log("User already signed in:", user.uid);
                            loadMemberDetails(); // Muat detail anggota setelah Firebase terinisialisasi dan pengguna login
                        } else {
                            try {
                                await signInAnonymously(auth);
                                console.log("Signed in anonymously.");
                                loadMemberDetails(); // Muat detail anggota setelah sign-in anonim berhasil
                            } catch (error) {
                                console.error("Anonymous sign-in failed:", error.message);
                                // Pesan ini kemungkinan besar berarti Anda perlu mengaktifkan "Anonymous" sign-in provider di konsol Firebase Anda.
                                // Buka Firebase Console -> Authentication -> tab "Sign-in method" -> Aktifkan "Anonymous".
                                document.getElementById('member-details-card').innerHTML = `<p class="text-center text-red-500">Gagal login untuk memuat detail: ${error.message}<br>Harap pastikan "Anonymous" Sign-in Provider diaktifkan di Firebase Authentication Anda.</p>`;
                                // Redirect jika otentikasi gagal, misalnya ke index.html atau halaman error khusus
                                // window.location.href = window.location.origin + '/index.html'; 
                            }
                        }
                    });

                } catch (error) {
                    console.error("Firebase initialization error for member_detail.html:", error.message);
                    document.getElementById('member-details-card').innerHTML = `<p class="text-center text-red-500">Gagal menginisialisasi Firebase: ${error.message}</p>`;
                }
            } else {
                console.error("Firebase config is not available. Cannot initialize Firebase for member_detail.html.");
                document.getElementById('member-details-card').innerHTML = '<p class="text-center text-red-500">Konfigurasi Firebase tidak ditemukan. Mohon perbarui kode.</p>';
            }
        }

        async function loadMemberDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('id');
            const detailsCard = document.getElementById('member-details-card');

            if (!memberId) {
                detailsCard.innerHTML = '<p class="text-center text-red-500">ID Anggota tidak ditemukan di URL. Pastikan Anda membuka halaman ini dari tombol "Detail" di dashboard.</p>';
                return;
            }

            if (!firebaseInitialized || !db) {
                detailsCard.innerHTML = '<p class="text-center text-red-500">Firebase belum terinisialisasi.</p>';
                return;
            }

            try {
                const memberDocRef = doc(db, membersCollectionPath, memberId);
                const docSnap = await getDoc(memberDocRef);

                if (docSnap.exists()) {
                    const member = docSnap.data();
                    
                    // Update main detail card
                    detailsCard.innerHTML = `
                        <div class="text-center mb-6">
                            <img src="${member.photoUrl || 'https://placehold.co/150x150/CCCCCC/000000?text=Foto'}" alt="Foto Anggota" class="w-36 h-36 rounded-full object-cover mx-auto mb-4 border-4 border-primary shadow-lg">
                            <h2 class="text-3xl font-bold text-primary mb-2">${member.name || 'Nama Tidak Tersedia'}</h2>
                            <p class="text-lg text-gray-700"><strong>Nomor Anggota:</strong> ${memberId}</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-lg text-gray-700">
                            <div class="detail-item"><i class="fas fa-calendar-alt"></i><strong>Tanggal Lahir:</strong> ${member.dateOfBirth || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-map-marker-alt"></i><strong>Tempat Lahir:</strong> ${member.placeOfBirth || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-tshirt"></i><strong>Tingkat Sabuk:</strong> ${member.beltLevel || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-building"></i><strong>Dojo:</strong> ${member.dojoName || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-city"></i><strong>Cabang:</strong> ${member.city || 'N/A'}</div>
                            <div class="detail-item col-span-full">
                                <i class="fas fa-link"></i>
                                <div>
                                    <strong>Dokumen:</strong><br>
                                    <a href="${member.birthCertUrl}" target="_blank" class="text-blue-500 hover:underline">Akta Kelahiran</a><br>
                                    <a href="${member.beltCertUrl}" target="_blank" class="text-blue-500 hover:underline">Ijazah Sabuk</a>
                                </div>
                            </div>
                        </div>
                        <div class="qrcode-container">
                            <h3 class="text-xl font-bold text-secondary mb-2">QR Code Kehadiran</h3>
                            <canvas id="member-detail-qrcode"></canvas>
                            <p class="text-sm text-gray-600 mt-2">ID Anggota: ${memberId}</p>
                        </div>
                        <button id="show-id-card-preview-btn" class="mt-8 w-full bg-primary text-white px-6 py-3 rounded-full font-bold hover:bg-red-700 transition duration-300 shadow-md">
                            <i class="fas fa-id-card mr-2"></i>Tampilkan ID Card
                        </button>
                    `;

                    // Generate QR Code for main detail page
                    const qrcodeCanvas = document.getElementById('member-detail-qrcode');
                    if (qrcodeCanvas && typeof window.QRious !== 'undefined') {
                        new window.QRious({
                            element: qrcodeCanvas,
                            value: String(memberId),
                            size: 150,
                            foreground: '#000000',
                            background: '#ffffff',
                            level: 'H'
                        });
                    } else {
                        detailsCard.querySelector('.qrcode-container').innerHTML += `<p class="text-red-500">Gagal membuat QR Code: Library tidak dimuat atau elemen tidak ditemukan.</p>`;
                    }

                    // Attach event listener for the new preview button
                    document.getElementById('show-id-card-preview-btn').addEventListener('click', () => {
                        showIdCardPreviewModal(member); // Pass the whole member object
                    });

                } else {
                    detailsCard.innerHTML = '<p class="text-center text-red-500">Detail anggota tidak ditemukan.</p>';
                }
            } catch (error) {
                console.error("Error loading member details:", error);
                detailsCard.innerHTML = `<p class="text-center text-red-500">Gagal memuat detail anggota: ${error.message}</p>`;
            }
        }

        // Fungsi untuk menampilkan modal pratinjau ID Card
        async function showIdCardPreviewModal(memberData) {
            const previewModalOverlay = document.getElementById('id-card-preview-modal-overlay');
            const previewIdCardArea = document.getElementById('id-card-preview-content'); // This is the .id-card-content-wrapper

            // Populate the preview ID card area
            document.getElementById('preview-id-card-photo').src = memberData.photoUrl || 'https://placehold.co/100x100/CCCCCC/000000?text=Foto';
            document.getElementById('preview-id-card-name').textContent = memberData.name;
            document.getElementById('preview-id-card-dob').textContent = `TTL: ${memberData.placeOfBirth || 'N/A'}, ${memberData.dateOfBirth || 'N/A'}`;
            document.getElementById('preview-id-card-belt').textContent = `Sabuk: ${memberData.beltLevel || 'N/A'}`;
            document.getElementById('preview-id-card-dojo').textContent = `Dojo: ${memberData.dojoName || 'N/A'}`;
            document.getElementById('preview-id-card-city').textContent = `Cabang: ${memberData.city || 'N/A'}`;

            // Generate QR Code for the preview ID card
            const previewQrcodeCanvas = document.getElementById('id-card-preview-qrcode');
            if (previewQrcodeCanvas && typeof window.QRious !== 'undefined') {
                previewQrcodeCanvas.innerHTML = ''; // Clear previous QR
                new window.QRious({
                    element: previewQrcodeCanvas,
                    value: String(memberData.id),
                    size: 128,
                    foreground: '#000000',
                    background: '#ffffff',
                    level: 'H'
                });
            } else {
                 console.error("Error: Library QRious tidak dimuat atau elemen QR Code tidak ditemukan untuk pratinjau ID Card.");
                 // Optionally, display an error message in the modal if QR generation fails
            }

            // Show the modal
            previewModalOverlay.classList.add('active');

            // Attach event listeners for print/download buttons inside the modal
            document.getElementById('modal-print-id-card-btn').onclick = () => printIdCardFromPreview(previewIdCardArea);
            document.getElementById('modal-download-id-card-btn').onclick = () => downloadIdCardFromPreview(previewIdCardArea, memberData.name);
            document.getElementById('close-id-card-preview-modal').onclick = () => previewModalOverlay.classList.remove('active');
        }

        // Fungsi untuk mencetak ID Card dari modal pratinjau
        async function printIdCardFromPreview(elementToPrint) {
            // Hide modal buttons and overlay effects temporarily for print
            const modalActions = document.querySelector('#id-card-preview-modal-overlay .modal-actions');
            const overlay = document.getElementById('id-card-preview-modal-overlay');
            if (modalActions) modalActions.style.display = 'none';
            if (overlay) overlay.style.backgroundColor = 'white'; // Make background white for print

            window.print();

            // Restore modal buttons and overlay effects after printing
            setTimeout(() => {
                if (modalActions) modalActions.style.display = '';
                if (overlay) overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
            }, 500);
        }

        // Fungsi untuk mengunduh ID Card sebagai gambar dari modal pratinjau
        async function downloadIdCardFromPreview(elementToCapture, memberName) {
            try {
                // Ensure images are loaded before capturing
                const imgElements = elementToCapture.querySelectorAll('img');
                const imageLoadPromises = Array.from(imgElements).map(img => {
                    if (img.complete) return Promise.resolve();
                    return new Promise(resolve => {
                        img.onload = resolve;
                        img.onerror = resolve; // Resolve even on error to not block
                    });
                });
                await Promise.all(imageLoadPromises);

                const canvas = await html2canvas(elementToCapture, {
                    scale: 4, // Increase scale for higher resolution
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                const link = document.createElement('a');
                link.download = `${memberName.replace(/\s/g, '_')}_ID_Card_Preview.png`;
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                console.log("ID Card pratinjau berhasil diunduh.");
            } catch (error) {
                console.error("Error downloading ID Card preview:", error);
                alert("Gagal mengunduh ID Card pratinjau. Pastikan semua gambar memiliki CORS yang diizinkan atau coba lagi.");
            }
        }


        document.addEventListener('DOMContentLoaded', initializeFirebaseAndAuth);
    </script>
</head>

            <a href="index.html" class="flex items-center space-x-2">

            </a>
            <!-- Back to Dashboard Link -->
            <div class="flex items-center space-x-4">

    <!-- Konten Halaman Detail Anggota -->
    <main class="flex-grow flex items-center justify-center p-4">

            <p class="text-center text-gray-500">Memuat detail anggota...</p>
        </section>
    </main>

    <!-- ID Card Preview Modal -->
    <div id="id-card-preview-modal-overlay" class="modal-overlay">
